<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Download Starlane</title>

  <meta name="description" content="Download Starlane on Google Play. Dodge asteroids, survive combat, collect upgrades, and climb the leaderboard." />

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at center, rgba(0, 190, 255, 0.12), transparent 36%),
        linear-gradient(rgba(3, 8, 24, 0.62), rgba(3, 8, 24, 0.82)),
        url("BackgroundImageStarlane.PNG") center center / cover no-repeat fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      text-align: center;
      padding: 34px 26px;
      border-radius: 24px;
      background: rgba(8, 18, 48, 0.62);
      border: 1px solid rgba(120, 220, 255, 0.20);
      box-shadow:
        0 0 35px rgba(0, 180, 255, 0.13),
        inset 0 0 24px rgba(255, 255, 255, 0.025);
      backdrop-filter: blur(7px);
    }

    .badge {
      display: inline-block;
      margin-bottom: 12px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(55, 208, 111, 0.12);
      border: 1px solid rgba(55, 208, 111, 0.38);
      color: #8fffc1;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .creator-note {
      display: inline-block;
      margin-bottom: 18px;
      padding: 7px 13px;
      border-radius: 999px;
      background: rgba(80, 180, 255, 0.10);
      border: 1px solid rgba(110, 210, 255, 0.26);
      color: rgba(255, 255, 255, 0.82);
      font-size: 13px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 40px;
      line-height: 1.1;
      letter-spacing: 0.5px;
      text-shadow: 0 0 18px rgba(80, 220, 255, 0.28);
    }

    .subtitle {
      margin: 0 auto 24px;
      max-width: 365px;
      font-size: 16px;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.88);
    }

    .thanks {
      margin: 0 auto 20px;
      max-width: 350px;
      font-size: 14px;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.70);
    }

    .button {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
      max-width: 300px;
      padding: 17px 22px;
      border-radius: 15px;
      background: #35d06f;
      color: #06120b;
      text-decoration: none;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.2px;
      box-shadow:
        0 0 22px rgba(53, 208, 111, 0.28),
        0 8px 24px rgba(0, 0, 0, 0.24);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .button::before {
      content: "";
      position: absolute;
      top: 0;
      left: -85%;
      width: 55%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent,
        rgba(255, 255, 255, 0.42),
        transparent
      );
      transform: skewX(-18deg);
      animation: shine 2.7s infinite;
    }

    @keyframes shine {
      0% {
        left: -85%;
      }
      45% {
        left: 125%;
      }
      100% {
        left: 125%;
      }
    }

    .button:active {
      transform: scale(0.98);
      box-shadow: 0 0 12px rgba(53, 208, 111, 0.22);
    }

    .fallback {
      margin-top: 22px;
      font-size: 14px;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.74);
    }

    .game-name {
      color: #7cffb2;
      font-weight: 900;
    }

    .small-note {
      margin-top: 16px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.48);
    }

    @media (max-width: 480px) {
      body {
        padding: 18px;
        background-attachment: scroll;
      }

      .card {
        padding: 30px 22px;
        border-radius: 22px;
      }

      h1 {
        font-size: 36px;
      }

      .subtitle {
        font-size: 15px;
      }

      .button {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="badge">Free Android Arcade Game</div>

    <br />

    <div class="creator-note">Featured by Neto Lyra</div>

    <h1>Starlane</h1>

    <p class="subtitle">
      Dodge asteroids, survive combat, collect upgrades, and climb the leaderboard.
    </p>

    <p class="thanks">
      Thanks for checking out Starlane. Good luck, pilot.
    </p>

    <a
      class="button"
      href="https://play.google.com/store/apps/details?id=com.voidpath.starlane&referrer=utm_source%3Dinstagram%26utm_medium%3Dstory%26utm_campaign%3Dnetolyra_story2"
      target="_blank"
      rel="noopener noreferrer"
    >
      Download on Google Play
    </a>

    <div class="fallback">
      If the button does not work, search
      <span class="game-name">Starlane</span>
      on Google Play.
    </div>

    <div class="small-note">
      Available on Android
    </div>
  </main>
</body>
</html>
