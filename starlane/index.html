<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download Starlane</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1b2b6f, #050816 70%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .card {
      max-width: 420px;
    }

    img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 10px;
    }

    p {
      font-size: 16px;
      line-height: 1.5;
      opacity: 0.9;
      margin-bottom: 24px;
    }

    a.button {
      display: inline-block;
      background: #35d06f;
      color: #06110a;
      text-decoration: none;
      font-weight: bold;
      padding: 16px 24px;
      border-radius: 14px;
      font-size: 18px;
      margin-bottom: 18px;
    }

    .fallback {
      font-size: 14px;
      opacity: 0.8;
      margin-top: 16px;
    }

    .game-name {
      font-weight: bold;
      color: #7cffb2;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Starlane</h1>
    <p>
      Dodge asteroids, survive combat, collect upgrades, and climb the leaderboard.
    </p>

    <a class="button" href="https://play.google.com/store/apps/details?id=com.voidpath.starlane&referrer=utm_source%3Dinstagram%26utm_medium%3Dstory%26utm_campaign%3Dnetolyra_story2">
      Download on Google Play
    </a>

    <div class="fallback">
      If the button does not work, search <span class="game-name">Starlane</span> on Google Play.
    </div>
  </div>
</body>
</html>
